name: Solar System DevSecOps CI

run-name: Solar System CI - ${{ github.event_name }} - ${{ github.ref_name }} # Shows Event name (pull or push) & Branch name that triggerd the Workflow

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - 'feature/*'

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

  
  MONGO_URI: ${{ vars.MONGO_URI }}
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}


jobs:

  gitleaks-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snyk-sca:
    name: Snyk SCA - Dependency Security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Snyk Dependency Scan
        id: snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: >-
            --severity-threshold=high
            --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
          category: snyk-sca

      - name: Enforce Snyk Security Gate
        if: steps.snyk.outcome == 'failure'
        run: |
          echo "::error::Snyk detected High or Critical dependency vulnerabilities."
          echo "::error::Review the Snyk findings in the GitHub Security tab."
          exit 1

  semgrep-sast:
    name: Semgrep SAST - Static Application Security Testing
    runs-on: ubuntu-latest

    permissions:
      contents: read

    container:
      image: semgrep/semgrep

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config auto \
            --error

  unit-testing:
    name: Unit Testing - Node ${{ matrix.nodejs_version }} - ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        nodejs_version:
          - 20
          - 22
          - 24

        os:
          - ubuntu-latest
          - macos-latest

        exclude:
          - nodejs_version: 20
            os: macos-latest

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup NodeJS ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodejs_version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mocha-test-results-node-${{ matrix.nodejs_version }}-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 10


  # ============================================================
  # 5. CODE COVERAGE
  # ============================================================

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Code Coverage
        run: npm run coverage

      - name: Archive Coverage Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-results
          path: coverage
          if-no-files-found: warn
          retention-days: 10